<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Grandiet Corrientes</title>
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f6f0; color: #222; min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .login-card { background: #fff; border-radius: 14px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; box-shadow: 0 6px 32px rgba(0,0,0,.1); }
    .login-logo { display: flex; align-items: center; gap: .6rem; margin-bottom: .3rem; }
    .login-logo .mark { width: 36px; height: 36px; background: #8DB33E; border-radius: 8px; color: #fff; font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .login-logo strong { font-size: 1.2rem; }
    .login-logo small { color: #888; font-size: .8rem; display: block; }
    .login-card h1 { font-size: 1rem; color: #555; margin-bottom: 1.5rem; font-weight: 400; }

    /* ── FORMS ── */
    .field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .9rem; }
    .field label { font-size: .8rem; font-weight: 600; color: #555; }
    .field input, .field select, .field textarea {
      padding: .55rem .8rem; border: 1.5px solid #ddd; border-radius: 7px;
      font-size: .95rem; width: 100%; background: #fff; transition: border .15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #8DB33E; }
    .field textarea { resize: vertical; min-height: 72px; }
    .field small { color: #999; font-size: .75rem; }

    /* ── BUTTONS ── */
    .btn { padding: .55rem 1.1rem; border: none; border-radius: 7px; font-size: .875rem; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #8DB33E; color: #fff; }
    .btn-secondary { background: #eee; color: #444; }
    .btn-danger { background: #e53e3e; color: #fff; }
    .btn-sm { padding: .3rem .65rem; font-size: .78rem; }
    .btn-full { width: 100%; margin-top: .25rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg { color: #e53e3e; font-size: .82rem; min-height: 1.1em; margin: .4rem 0; }

    /* ── HEADER ── */
    #dashboard { min-height: 100vh; }
    .admin-header {
      background: #fff; border-bottom: 1px solid #e8e8e8;
      padding: .8rem 1.5rem; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .header-brand { display: flex; align-items: center; gap: .5rem; }
    .header-brand .mark { width: 30px; height: 30px; background: #8DB33E; border-radius: 6px; color: #fff; font-weight: 800; font-size: .9rem; display: flex; align-items: center; justify-content: center; }
    .header-brand span { font-weight: 700; font-size: 1rem; }
    .header-brand small { color: #888; font-size: .75rem; font-weight: 400; margin-left: .3rem; }

    /* ── MAIN ── */
    .admin-main { padding: 1.5rem; max-width: 1140px; margin: 0 auto; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: .75rem; }
    .toolbar h2 { font-size: 1.15rem; }
    .toolbar-right { display: flex; gap: .6rem; align-items: center; }

    /* ── TABLE ── */
    .table-wrap { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
    table { width: 100%; border-collapse: collapse; font-size: .875rem; table-layout: auto; }
    th, td { vertical-align: middle; }
    th { background: #f8f8f8; padding: .65rem 1rem; text-align: left; font-size: .75rem; color: #777; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #eee; white-space: nowrap; }
    td { padding: .7rem 1rem; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafff4; }
    .td-actions { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
    .img-thumb { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; background: #f0f0f0; display: block; }
    .no-img { width: 42px; height: 42px; border-radius: 6px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: .65rem; color: #bbb; }
    .badge { display: inline-block; padding: .12rem .45rem; border-radius: 20px; font-size: .7rem; font-weight: 700; margin: .1rem .05rem; }
    .badge-best { background: #e8f0d5; color: #4a7a10; }
    .badge-new { background: #dceef7; color: #1a6a8a; }
    .badge-offer { background: #fdecea; color: #c0392b; }
    .price-col { font-weight: 600; white-space: nowrap; }
    .old-price { color: #bbb; text-decoration: line-through; font-size: .8rem; display: block; }
    .stock-low { color: #e53e3e; font-weight: 700; }
    .empty-row td { text-align: center; color: #999; padding: 3rem; }

    /* ── MODAL ── */
    #productModal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
    .modal-panel {
      position: relative; background: #fff; border-radius: 14px;
      width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      padding: 1.75rem; box-shadow: 0 12px 48px rgba(0,0,0,.2);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .modal-header h2 { font-size: 1.1rem; }
    .modal-close { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #999; line-height: 1; padding: .15rem .3rem; border-radius: 4px; }
    .modal-close:hover { color: #333; background: #f0f0f0; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .tags-group { display: flex; gap: 1rem; flex-wrap: wrap; padding: .1rem 0; }
    .tag-check { display: flex; align-items: center; gap: .4rem; font-size: .875rem; cursor: pointer; user-select: none; }
    .tag-check input { cursor: pointer; accent-color: #8DB33E; width: 15px; height: 15px; }
    .form-actions { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #eee; }

    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
      .admin-main { padding: 1rem; }
      .admin-header { padding: .7rem 1rem; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">G</div>
      <div><strong>Grandiet</strong><small>Corrientes</small></div>
    </div>
    <h1>Panel de administración</h1>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="admin@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <p class="error-msg" id="loginError"></p>
      <button class="btn btn-primary btn-full" type="submit" id="loginBtn">Ingresar</button>
    </form>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard" hidden>
  <header class="admin-header">
    <div class="header-brand">
      <div class="mark">G</div>
      <span>Grandiet <small>Admin</small></span>
    </div>
    <button class="btn btn-secondary btn-sm" id="logoutBtn">Cerrar sesión</button>
  </header>
  <main class="admin-main">
    <div class="toolbar">
      <h2>Productos (<span id="productCount">—</span>)</h2>
      <div class="toolbar-right">
        <button class="btn btn-secondary btn-sm" id="reloadBtn">↺ Recargar</button>
        <button class="btn btn-primary" id="addProductBtn">+ Agregar producto</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Tags</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="productsBody">
          <tr class="empty-row"><td colspan="7">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ── MODAL ── -->
<div id="productModal" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-panel">
    <div class="modal-header">
      <h2 id="modalTitle">Nuevo producto</h2>
      <button class="modal-close" id="modalClose" type="button" aria-label="Cerrar">×</button>
    </div>
    <form id="productForm" novalidate>
      <div class="field">
        <label for="fName">Nombre *</label>
        <input id="fName" type="text" required placeholder="Ej: Avena integral x 1 kg">
      </div>
      <div class="form-row">
        <div class="field">
          <label for="fCategory">Categoría *</label>
          <select id="fCategory" required>
            <option value="">Seleccionar...</option>
            <option>Cereales</option>
            <option>Frutos secos</option>
            <option>Semillas</option>
            <option>Suplementos</option>
            <option>Sin TACC</option>
            <option>Harinas</option>
            <option>Snacks saludables</option>
          </select>
        </div>
        <div class="field">
          <label for="fStock">Stock</label>
          <input id="fStock" type="number" min="0" step="1" placeholder="0">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="fPrice">Precio (ARS) *</label>
          <input id="fPrice" type="number" min="0" required placeholder="0">
        </div>
        <div class="field">
          <label for="fOldPrice">Precio anterior (para mostrar oferta)</label>
          <input id="fOldPrice" type="number" min="0" placeholder="Dejar vacío si no hay oferta">
        </div>
      </div>
      <div class="field">
        <label for="fDescription">Descripción</label>
        <textarea id="fDescription" placeholder="Breve descripción del producto..."></textarea>
      </div>
      <div class="field">
        <label for="fImage">Imagen</label>
        <input id="fImage" type="text" placeholder="Ej: avena-integral.jpg o assets/avena-integral.jpg">
        <small>Nombre del archivo en la carpeta assets/ del proyecto.</small>
      </div>
      <div class="field">
        <label>Tags</label>
        <div class="tags-group">
          <label class="tag-check"><input type="checkbox" id="tagBest"> Más vendido</label>
          <label class="tag-check"><input type="checkbox" id="tagNew"> Nuevo</label>
          <label class="tag-check"><input type="checkbox" id="tagOffer"> Oferta</label>
        </div>
      </div>
      <p class="error-msg" id="formError"></p>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelModal">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import {
  db, auth,
  collection, getDocs, addDoc, updateDoc, deleteDoc, doc,
  signInWithEmailAndPassword, signOut, onAuthStateChanged,
} from "./firebase.js";

// DOM
const $ = (id) => document.getElementById(id);
const loginScreen  = $("loginScreen");
const dashboard    = $("dashboard");
const loginForm    = $("loginForm");
const loginEmail   = $("loginEmail");
const loginPassword = $("loginPassword");
const loginError   = $("loginError");
const loginBtn     = $("loginBtn");
const logoutBtn    = $("logoutBtn");
const reloadBtn    = $("reloadBtn");
const productsBody = $("productsBody");
const productCount = $("productCount");
const addProductBtn = $("addProductBtn");
const productModal = $("productModal");
const modalBackdrop = $("modalBackdrop");
const modalTitle   = $("modalTitle");
const modalClose   = $("modalClose");
const cancelModal  = $("cancelModal");
const productForm  = $("productForm");
const formError    = $("formError");
const fName        = $("fName");
const fCategory    = $("fCategory");
const fStock       = $("fStock");
const fPrice       = $("fPrice");
const fOldPrice    = $("fOldPrice");
const fDescription = $("fDescription");
const fImage       = $("fImage");
const tagBest      = $("tagBest");
const tagNew       = $("tagNew");
const tagOffer     = $("tagOffer");

let editingId = null;
let allProducts = [];

function money(v) {
  return new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(v || 0);
}

function imgSrc(image) {
  if (!image) return null;
  if (image.startsWith("assets/") || image.startsWith("http")) return image;
  return `assets/${image}`;
}

function showDashboard() {
  loginScreen.hidden = true;
  dashboard.hidden = false;
  loadProducts();
}

function showLogin() {
  productModal.hidden = true;
  editingId = null;
  loginScreen.hidden = false;
  dashboard.hidden = true;
}

// ── Auth ──
onAuthStateChanged(auth, (user) => {
  if (user) {
    showDashboard();
  } else {
    showLogin();
  }
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.textContent = "";
  loginBtn.disabled = true;
  loginBtn.textContent = "Ingresando...";
  try {
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
  } catch (err) {
    const msgs = {
      "auth/invalid-credential": "Email o contraseña incorrectos.",
      "auth/user-not-found": "Usuario no encontrado.",
      "auth/wrong-password": "Contraseña incorrecta.",
      "auth/too-many-requests": "Demasiados intentos. Intentá más tarde.",
    };
    loginError.textContent = msgs[err.code] || "Error al ingresar. Revisá los datos.";
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Ingresar";
  }
});

logoutBtn.addEventListener("click", () => signOut(auth));

// ── Load products ──
async function loadProducts() {
  productsBody.innerHTML = `<tr class="empty-row"><td colspan="7">Cargando...</td></tr>`;
  try {
    const snapshot = await getDocs(collection(db, "products"));
    allProducts = snapshot.docs.map((d) => ({ id: d.id, tags: [], ...d.data() }));
    renderTable();
  } catch (e) {
    productsBody.innerHTML = `<tr class="empty-row"><td colspan="7">Error al cargar productos. Revisá la conexión.</td></tr>`;
    console.error(e);
  }
}

reloadBtn.addEventListener("click", loadProducts);

// ── Render table ──
function renderTable() {
  productCount.textContent = allProducts.length;
  if (!allProducts.length) {
    productsBody.innerHTML = `<tr class="empty-row"><td colspan="7">No hay productos. Agregá el primero.</td></tr>`;
    return;
  }
  const sorted = [...allProducts].sort((a, b) => (a.category || "").localeCompare(b.category || "") || (a.name || "").localeCompare(b.name || ""));
  productsBody.innerHTML = sorted.map((p) => {
    const tags = (p.tags || []).map((t) => {
      const label = t === "best" ? "vendido" : t === "new" ? "nuevo" : "oferta";
      return `<span class="badge badge-${t}">${label}</span>`;
    }).join("");
    const src = imgSrc(p.image);
    const imgEl = src
      ? `<img class="img-thumb" src="${src}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'no-img',textContent:'sin img'}))">`
      : `<div class="no-img">sin img</div>`;
    const stockVal = p.stock ?? "—";
    const stockClass = typeof p.stock === "number" && p.stock <= 3 ? "stock-low" : "";
    const oldEl = p.oldPrice ? `<span class="old-price">${money(p.oldPrice)}</span>` : "";
    return `<tr>
      <td>${imgEl}</td>
      <td><strong>${p.name || "—"}</strong></td>
      <td>${p.category || "—"}</td>
      <td class="price-col">${money(p.price)}${oldEl}</td>
      <td class="${stockClass}">${stockVal}</td>
      <td>${tags || "—"}</td>
      <td><div class="td-actions">
        <button class="btn btn-secondary btn-sm" data-edit="${p.id}">Editar</button>
        <button class="btn btn-danger btn-sm" data-delete="${p.id}">Borrar</button>
      </div></td>
    </tr>`;
  }).join("");
}

// ── Table actions ──
productsBody.addEventListener("click", async (e) => {
  const editBtn = e.target.closest("[data-edit]");
  const delBtn  = e.target.closest("[data-delete]");

  if (editBtn) {
    openModal(editBtn.dataset.edit);
  }

  if (delBtn) {
    const id = delBtn.dataset.delete;
    const prod = allProducts.find((p) => p.id === id);
    if (!prod) return;
    if (!confirm(`¿Borrar "${prod.name}"?\nEsta acción no se puede deshacer.`)) return;
    delBtn.disabled = true;
    try {
      await deleteDoc(doc(db, "products", id));
      allProducts = allProducts.filter((p) => p.id !== id);
      renderTable();
    } catch {
      alert("Error al borrar el producto. Intentá de nuevo.");
      delBtn.disabled = false;
    }
  }
});

// ── Modal ──
function openModal(editId = null) {
  editingId = editId;
  productForm.reset();
  formError.textContent = "";

  if (editId) {
    const p = allProducts.find((p) => p.id === editId);
    if (!p) return;
    modalTitle.textContent = "Editar producto";
    fName.value        = p.name || "";
    fCategory.value    = p.category || "";
    fStock.value       = p.stock ?? "";
    fPrice.value       = p.price || "";
    fOldPrice.value    = p.oldPrice || "";
    fDescription.value = p.description || "";
    fImage.value       = p.image || "";
    tagBest.checked    = (p.tags || []).includes("best");
    tagNew.checked     = (p.tags || []).includes("new");
    tagOffer.checked   = (p.tags || []).includes("offer");
  } else {
    modalTitle.textContent = "Nuevo producto";
  }

  productModal.hidden = false;
  fName.focus();
}

function closeModal() {
  productModal.hidden = true;
  editingId = null;
}

addProductBtn.addEventListener("click", () => openModal());
modalClose.addEventListener("click", closeModal);
cancelModal.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", closeModal);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

// ── Save ──
productForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  formError.textContent = "";

  if (!fName.value.trim()) { formError.textContent = "El nombre es obligatorio."; fName.focus(); return; }
  if (!fCategory.value)    { formError.textContent = "Seleccioná una categoría."; fCategory.focus(); return; }
  if (!fPrice.value)       { formError.textContent = "El precio es obligatorio."; fPrice.focus(); return; }

  const saveBtn = $("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Guardando...";

  const tags = [];
  if (tagBest.checked)  tags.push("best");
  if (tagNew.checked)   tags.push("new");
  if (tagOffer.checked) tags.push("offer");

  const data = {
    name:        fName.value.trim(),
    category:    fCategory.value,
    price:       Number(fPrice.value),
    oldPrice:    fOldPrice.value ? Number(fOldPrice.value) : 0,
    description: fDescription.value.trim(),
    image:       fImage.value.trim(),
    stock:       fStock.value !== "" ? Number(fStock.value) : 0,
    tags,
  };

  try {
    if (editingId) {
      await updateDoc(doc(db, "products", editingId), data);
      allProducts = allProducts.map((p) => p.id === editingId ? { id: editingId, ...data } : p);
    } else {
      const ref = await addDoc(collection(db, "products"), data);
      allProducts.push({ id: ref.id, ...data });
    }
    renderTable();
    closeModal();
  } catch (err) {
    formError.textContent = "Error al guardar: " + err.message;
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Guardar";
  }
});
</script>
</body>
</html>
